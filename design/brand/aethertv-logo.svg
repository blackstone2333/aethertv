<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">AetherTV logo</title><desc id="desc">A luminous A monogram held inside an orbital halo.</desc>
  <defs>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A9F7F0"/><stop offset=".48" stop-color="#6FE7D4"/><stop offset="1" stop-color="#B9A4FF"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#B9A4FF"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(34 18)">
    <circle cx="102" cy="102" r="72" fill="none" stroke="#6FE7D4" stroke-opacity=".13" stroke-width="20"/>
    <ellipse cx="102" cy="102" rx="94" ry="61" fill="none" stroke="url(#halo)" stroke-width="5" transform="rotate(-28 102 102)" filter="url(#glow)"/>
    <path d="M102 33 55 164h24l10-30h28l10 30h24L104 33h-2Zm1 42 9 35H91l11-35h1Z" fill="url(#word)"/>
    <circle cx="177" cy="56" r="5" fill="#F7FAFF"/><circle cx="32" cy="142" r="3" fill="#6FE7D4"/>
  </g>
  <g transform="translate(250 76)">
    <text x="0" y="48" fill="url(#word)" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="52" font-weight="700" letter-spacing="7">AETHER</text>
    <text x="4" y="91" fill="#6FE7D4" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="22" font-weight="600" letter-spacing="12">TELEVISION</text>
  </g>
</svg>

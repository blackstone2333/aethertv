<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>AetherTV</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --label: #000; --secondary: rgba(60,60,67,.6); --tertiary: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18); --tint: #007aff; --fill: rgba(118,118,128,.12); --danger: #ff3b30;
    --bar: rgba(249,249,249,.82); --bar-line: rgba(0,0,0,.14); --scrim: rgba(0,0,0,.32); --sheet: #f2f2f7;
    --ease-out: cubic-bezier(.23,1,.32,1); --ease-drawer: cubic-bezier(.32,.72,0,1);
    --tabbar: calc(82px + env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,.6); --tertiary: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6); --tint: #0a84ff; --fill: rgba(118,118,128,.24); --danger: #ff453a;
      --bar: rgba(22,22,22,.82); --bar-line: rgba(255,255,255,.12); --scrim: rgba(0,0,0,.5); --sheet: #1c1c1e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; }
  /* A display rule would otherwise show what is hidden. */
  [hidden] { display: none !important; }

  main { max-width: 720px; margin: 0 auto; padding: env(safe-area-inset-top) 16px calc(var(--tabbar) + 32px); }
  header { padding: 28px 4px 4px; }
  header h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  header p { margin: 2px 0 0; color: var(--secondary); font-size: 15px; }

  h2 { font-size: 13px; font-weight: 400; color: var(--secondary); margin: 28px 16px 7px; }
  h2.big { font-size: 20px; font-weight: 700; text-transform: none; letter-spacing: -.01em; color: var(--label); margin: 28px 4px 10px; }
  .foot { color: var(--secondary); font-size: 13px; margin: 7px 16px 0; }
  .foot .link { font-size: 13px; }
  #sections .foot { margin: 8px 4px 0; }
  section > .list:first-child, section > .hero:first-child { margin-top: 14px; }

  /* Inset grouped list, as in iOS Settings. */
  .list { background: var(--card); border-radius: 12px; overflow: hidden; }
  .item {
    position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 11px 16px;
    border: 0; background: none; text-align: left; transition: background-color .2s ease;
  }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  button.item:active, label.item:active { background: var(--fill); transition-duration: 0s; }
  .item .txt { flex: 1; min-width: 0; }
  .item .sub { display: block; font-size: 13px; color: var(--secondary); margin-top: 2px; }
  .item .val { color: var(--secondary); white-space: nowrap; }
  .item .chev { color: var(--tertiary); flex-shrink: 0; }
  .item.tint { color: var(--tint); }
  .item.danger { color: var(--danger); }
  .item.center { justify-content: center; font-weight: 500; }
  .item .thumb { width: 64px; aspect-ratio: 16 / 9; border-radius: 6px; object-fit: cover; background: var(--fill); flex-shrink: 0; }
  .item:has(.thumb) + .item::before { left: 92px; }
  .tick { color: var(--tint); flex-shrink: 0; opacity: 0; transform: scale(.8); transition: opacity .15s ease, transform .2s var(--ease-out); }
  [aria-checked="true"] .tick { opacity: 1; transform: none; }
  .item[disabled] { opacity: .5; }
  .item select { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
  .switch {
    appearance: none; -webkit-appearance: none; position: relative; flex-shrink: 0; width: 51px; height: 31px; margin: 0;
    border-radius: 16px; background: var(--fill); cursor: pointer; transition: background-color .2s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .25s var(--ease-out);
  }
  .switch:checked { background: #34c759; }
  .switch:checked::after { transform: translateX(20px); }
  .switch:disabled { opacity: .5; }

  /* Wallpaper cards. */
  .hero { position: relative; margin-top: 14px; border-radius: 16px; overflow: hidden; background: var(--fill); aspect-ratio: 16 / 9; }
  .hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .hero .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 32px 16px 12px; color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0));
  }
  .hero .cap small { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; opacity: .8; }
  .hero .cap b { font-size: 20px; font-weight: 600; }
  /* Cells start at the top: a button centres its content, so a tile without a caption sat lower than its neighbour. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; align-items: start; }
  .wp { position: relative; display: block; border: 0; padding: 0; background: none; text-align: left; min-width: 0; }
  .wp .pic {
    position: relative; border-radius: 12px; overflow: hidden; background: var(--fill); aspect-ratio: 16 / 9;
    transition: transform .16s var(--ease-out), box-shadow .2s ease;
  }
  .wp .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .wp:active .pic { transform: scale(.97); }
  .wp[aria-selected="true"] .pic { box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 5px var(--tint); }
  .wp .t { font-size: 14px; font-weight: 500; margin: 7px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp .c { font-size: 12px; color: var(--secondary); margin: 1px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check {
    position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--tint); color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); opacity: 0; transform: scale(.8);
    transition: opacity .15s ease, transform .2s var(--ease-out);
  }
  .wp[aria-selected="true"] .check { opacity: 1; transform: none; }
  .badge {
    position: absolute; top: 7px; left: 7px; width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0;
    background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: transform .16s var(--ease-out);
  }
  .badge:active { transform: scale(.9); }
  .tag { position: absolute; left: 7px; bottom: 7px; font-size: 11px; font-weight: 600; color: #fff; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border: 0; border-radius: 12px;
    background: var(--tint); color: #fff; font-weight: 600; text-decoration: none; cursor: pointer;
    transition: transform .16s var(--ease-out), opacity .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .6; pointer-events: none; }
  .btn.plain { background: var(--card); color: var(--tint); }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row .btn { flex: 1; }
  .add { margin-bottom: 14px; }
  .empty { color: var(--secondary); font-size: 15px; padding: 4px 4px 0; margin: 0; }
  .link { appearance: none; border: 0; background: none; color: var(--tint); padding: 0; cursor: pointer; }

  .wx { display: flex; align-items: baseline; gap: 10px; }
  .wx b { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
  .wx span { color: var(--secondary); font-size: 15px; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field input {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--label); background: none; border: 0; outline: none; padding: 0;
  }
  .field input::placeholder { color: var(--tertiary); }
  .field .link { font-weight: 600; }
  .field .link[disabled] { opacity: .4; }
  /* A <pre>, not a textarea: focusing a field under 16px makes iOS zoom and scroll the page. */
  .diag {
    display: block; height: 220px; margin: 10px 0 0; overflow: auto; -webkit-overflow-scrolling: touch;
    font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
    -webkit-user-select: text; user-select: text;
    color: var(--label); background: var(--card); border-radius: 12px; padding: 10px;
  }

  /* One floating navigation layer; content groups retain their ordinary material. */
  nav {
    position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 10; width: min(calc(100% - 32px), 480px); height: 62px; padding: 5px;
    display: flex; gap: 4px; background: var(--bar); border-radius: 34px;
    border: .5px solid var(--bar-line);
    box-shadow: 0 8px 28px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 1px rgba(0,0,0,.12);
    -webkit-backdrop-filter: saturate(140%) blur(24px); backdrop-filter: saturate(140%) blur(24px);
  }
  nav button {
    flex: 1; min-width: 0; border: 0; background: none; border-radius: 28px; padding: 4px 2px;
    color: var(--secondary); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 11px; font-weight: 600; cursor: pointer;
    transition: background-color .2s var(--ease-out), color .2s;
  }
  nav button svg { transition: transform .16s var(--ease-out); }
  nav button:active svg { transform: scale(.9); }
  nav button[aria-selected="true"] { color: var(--tint); background: var(--fill); }
  @media (prefers-reduced-transparency: reduce) {
    nav { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) { nav { border: 1px solid var(--label); background: var(--card); } }

  /* Bottom sheet. Enters on the drawer curve; leaves faster than it came. */
  .back { display: inline-flex; align-items: center; gap: 3px; font-size: 17px; margin: 0 0 6px -2px; }
  .arow { min-height: 60px; background: var(--card); }
  .arow .thumb { width: 64px; }
  .arow .act { flex-shrink: 0; font-weight: 600; }
  /* Home mirrors the configured television column count. */
  .agrid {
    position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px 7px;
    padding: 12px 10px 14px; background: var(--card); border-radius: 14px;
  }
  .agrid .shelf { position: absolute; left: 4px; right: 4px; top: 4px; border-radius: 11px; background: var(--fill); pointer-events: none; }
  .atile {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; cursor: grab;
    touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .atile .tpic {
    width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--fill);
    box-shadow: 0 1px 2px rgba(0,0,0,.14); transition: transform .16s var(--ease-out), box-shadow .2s ease;
  }
  .atile .tpic img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  .atile .n { width: 100%; font-size: 10.5px; line-height: 1.25; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .atile:active .tpic { transform: scale(.95); }
  .agrid.sorting .atile:not(.lift) { transition: transform .26s var(--ease-out); }
  .atile.lift { z-index: 3; cursor: grabbing; }
  .atile.lift .tpic { transform: scale(1.14); box-shadow: 0 14px 30px rgba(0,0,0,.32), 0 3px 8px rgba(0,0,0,.18); }
  .atile.lift .n { opacity: 0; }
  .icon-sq { width: 30px; height: 30px; border-radius: 7px; background: var(--tint); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .sheet-wrap { position: fixed; inset: 0; z-index: 20; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .2s ease; }
  /* Into a folder from the right; back out of it from the left, the way it went. */
  .view.push { animation: push .26s var(--ease-out); }
  .view.pop { animation: pop .26s var(--ease-out); }
  @keyframes push { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .sheet {
    max-height: calc(100% - env(safe-area-inset-top) - 24px); overflow-y: auto; overscroll-behavior: contain;
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--sheet);
    border-radius: 14px 14px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .2s var(--ease-out);
  }
  .sheet-wrap.open .scrim { opacity: 1; transition-duration: .3s; }
  .sheet-wrap.open .sheet { transform: none; transition: transform .38s var(--ease-drawer); }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); margin: 0 auto 14px; }
  .sheet .pic { border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--fill); width: 62%; margin: 0 auto; }
  .sheet .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .sheet h3 { text-align: center; font-size: 17px; font-weight: 600; margin: 12px 0 2px; }
  .sheet .meta { text-align: center; font-size: 13px; color: var(--secondary); margin: 0 0 16px; }
  .sheet .list { background: var(--card); }
  @media (prefers-color-scheme: dark) { .sheet .list { background: #2c2c2e; } }
  .sheet .list + .list { margin-top: 10px; }

  .toast {
    position: fixed; z-index: 30; left: 50%; bottom: calc(var(--tabbar) + 16px); transform: translate(-50%, 12px);
    background: rgba(30,30,30,.92); color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 15px; max-width: calc(100% - 32px);
    opacity: 0; transition: opacity .2s ease, transform .3s var(--ease-out); pointer-events: none;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-wrap.open .sheet { transition: none; }
    .view.push, .view.pop { animation: none; }
    .agrid.sorting .atile:not(.lift) { transition: none; }
    .toast { transform: translate(-50%, 0); }
  }
  .item select { max-width: 52%; min-height: 40px; border: 0; border-radius: 10px; padding: 6px 8px; background: var(--fill); color: var(--tint); font: inherit; }
  #exchangeFiles .item { flex-wrap: wrap; gap: 10px; }
  #systemStats .val { max-width: 52%; overflow-wrap: anywhere; text-align: right; }
</style>
</head>
<body>
<main>
<header>
  <button class="link back" id="homeBack" hidden><svg width="11" height="18" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg><span data-i18n="tab_home"></span></button>
  <h1 id="title"></h1>
  <p>{{DEVICE}}</p>
</header>

<!-- Home screen: the TV's tiles, arranged here -->
<section data-tab="home">
  <div class="list" id="desktopHome"></div>
  <div id="homeBody"></div>
  <div id="inputsBox" hidden>
    <h2 data-i18n="inputs_h"></h2>
    <div class="list" id="inputs"></div>
    <p class="foot" data-i18n="inputs_hint"></p>
  </div>
  <input id="iconFile" type="file" accept="image/*" hidden>
</section>

<!-- Wallpaper and screensaver -->
<section data-tab="looks" hidden>
  <div class="hero" id="hero"><img id="heroImg" alt=""><div class="cap"><small data-i18n="current_wp"></small><b id="heroTitle"></b></div></div>
  <div class="list" id="desktopLooks"></div>
  <p class="foot" id="dailyMatch" data-i18n="new_no_matches" hidden></p>
  <div id="sections"></div>

  <h2 class="big" data-i18n="screensaver"></h2>
  <div class="list" id="ss" role="radiogroup" data-i18n-aria-label="screensaver_short">
    <button class="item" role="radio" data-mode="aerial"><span class="txt"><span data-i18n="ss_aerial"></span><span class="sub" data-i18n="hint_aerial"></span></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="item" role="radio" data-mode="photos"><span class="txt"><span data-i18n="ss_photos"></span><span class="sub" data-i18n="hint_photos"></span></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="item" role="radio" data-mode="clock"><span class="txt"><span data-i18n="ss_clock"></span><span class="sub" data-i18n="hint_clock"></span></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="item" role="radio" data-mode="videos"><span class="txt"><span data-i18n="ss_videos"></span><span class="sub" data-i18n="hint_videos"></span></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
  <p class="foot" id="ssFoot"></p>
  <div id="videos" hidden>
    <h2 data-i18n="videos_h"></h2>
    <div class="list" id="videoList"></div>
    <div class="list" style="margin-top:10px">
      <label class="item tint center" id="videoUploadBtn">
        <span id="videoUploadLabel" data-i18n="videos_upload"></span>
        <input id="videoFile" type="file" accept=".mp4,.mov,video/mp4,video/quicktime" multiple hidden>
      </label>
    </div>
    <p class="foot" data-i18n="videos_hint"></p>
  </div>
</section>

<!-- More -->
<section data-tab="more" hidden>
  <h2 data-i18n="system_info"></h2>
  <div class="list" id="systemStats" aria-live="off"></div>
  <div class="list"><button class="item center tint" id="systemRefresh" data-i18n="new_refresh"></button><button class="item center tint" id="systemClean" data-i18n="system_clean"></button></div>
  <p class="foot" data-i18n="system_clean_hint"></p>
  <h2 data-i18n="transfer_title"></h2>
  <label class="btn"><span id="exchangeLabel" data-i18n="transfer_upload"></span><input id="exchangeInput" type="file" hidden></label>
  <p class="foot" data-i18n="transfer_hint"></p>
  <div class="list" id="exchangeFiles"></div>
  <h2 data-i18n="focus"></h2>
  <div class="list" id="focus" role="radiogroup" data-i18n-aria-label="focus">
    <button class="item" role="radio" data-style="high_contrast"><span class="txt"><span data-i18n="focus_high"></span><span class="sub" data-i18n="focus_hint_high"></span></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="item" role="radio" data-style="standard"><span class="txt"><span data-i18n="focus_standard"></span><span class="sub" data-i18n="focus_hint_standard"></span></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>

  <h2 data-i18n="render_h"></h2>
  <div class="list" id="renderMode" role="radiogroup" data-i18n-aria-label="render_h">
    <button class="item" role="radio" data-render="auto"><span class="txt" data-i18n="render_auto"></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="item" role="radio" data-render="full"><span class="txt" data-i18n="render_full"></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="item" role="radio" data-render="lite"><span class="txt" data-i18n="render_lite"></span><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
  <p class="foot" data-i18n="render_hint"></p>
  <p class="foot" id="renderActive"></p>

  <h2 data-i18n="live_h"></h2>
  <p class="foot" data-i18n="live_hint"></p>
  <form class="list" id="liveForm">
    <label class="item field"><input id="liveId" type="text" data-i18n-placeholder="live_id_ph" autocomplete="off" required></label>
    <label class="item field"><input id="liveM3u" type="url" data-i18n-placeholder="live_m3u_ph" autocomplete="url" required></label>
    <label class="item field"><input id="liveEpg" type="url" data-i18n-placeholder="live_epg_ph" autocomplete="url"></label>

const TITLES = { home: 'tab_home', looks: 'looks_title', more: 'tab_more' };
// The four tabs of 1.46 and 1.47's first builds.
const OLD_TABS = { wallpaper: 'looks', screensaver: 'looks' };
const scrolls = {};
let tab = null;
function setTitle() {
  const L = (state && state.layout) || {};
  const folder = tab === 'home' && arrView !== null ? (L.home || []).find(e => e.id === arrView) : null;
  $('#title').textContent = folder ? folder.label : t(TITLES[tab]);
  $('#homeBack').hidden = !folder;
}
function show(next, keepScroll) {
  next = OLD_TABS[next] || next;
  if (!TABS.includes(next)) next = 'home';
  if (tab === next) {
    if (tab === 'home' && arrView !== null) { arrView = null; renderArrange('back'); return; }
    if (!keepScroll) window.scrollTo({ top: 0, behavior: scrollBehavior() });
    return;
  }
  if (tab) scrolls[tab] = window.scrollY;
  tab = next;
  if (next === 'more') queueMicrotask(refreshSystem);
  document.querySelectorAll('section[data-tab]').forEach(s => s.hidden = s.dataset.tab !== tab);
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.go === tab ? 'true' : 'false'));
  setTitle();
  if (tab === 'home') placeShelves();   // measured while the tab shows
  window.scrollTo(0, scrolls[tab] || 0);
  try { localStorage.setItem('aerial-tab', tab); } catch (e) {}
  history.replaceState(null, '', '#' + tab);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.go));
$('#homeBack').onclick = () => { arrView = null; renderArrange('back'); };

const reducedMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const scrollBehavior = () => reducedMotion() ? 'auto' : 'smooth';

/* Bottom sheet. */
const sheet = $('#sheet');
function openSheet(build) {
  const body = $('#sheetBody'); body.replaceChildren(); build(body);
  clearTimeout(openSheet.timer);
  sheet.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
}
function closeSheet() {
  sheet.classList.remove('open');
  clearTimeout(openSheet.timer); openSheet.timer = setTimeout(() => sheet.hidden = true, 220);
}
$('#scrim').onclick = closeSheet;

/*
 * Pull the sheet down to close it, as on iOS. A flick is enough (by speed, not distance); a slow
 * pull closes it past a third of its height, otherwise it springs back. Only from its top, so a
 * long sheet still scrolls, and only the first finger counts.
 */
(() => {
  const panel = sheet.querySelector('.sheet');
  let id = null, x0 = 0, y0 = 0, t0 = 0, dy = 0, dragging = false;
  const touch = e => [...e.changedTouches].find(t => t.identifier === id);
  panel.addEventListener('touchstart', e => {
    if (id !== null || e.touches.length !== 1 || panel.scrollTop > 0) return;
    const t = e.touches[0];
    id = t.identifier; x0 = t.clientX; y0 = t.clientY; t0 = performance.now(); dy = 0; dragging = false;
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    const t = touch(e); if (!t) return;
    const d = t.clientY - y0;
    if (!dragging) {
      // A sideways or upward move is not a pull: let it scroll or tap as usual.
      if (d < 0 || Math.abs(t.clientX - x0) > Math.abs(d)) { id = null; return; }
      if (d < 8) return;
      dragging = true; panel.style.transition = 'none';
    }
    e.preventDefault();
    dy = Math.max(0, d - 8);
    panel.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  const end = e => {
    if (!touch(e)) return;
    id = null;
    if (!dragging) return;
    dragging = false;
    const v = dy / Math.max(1, performance.now() - t0);
    // Back to the stylesheet's transitions: from where the finger left it, on to closed or open.
    panel.style.transition = ''; panel.style.transform = '';
    if (v > 0.11 || dy > panel.offsetHeight / 3) closeSheet();
  };
  panel.addEventListener('touchend', end);
  panel.addEventListener('touchcancel', end);
})();
function action(list, text, cls, fn) {
  const b = el('button', 'item center ' + (cls || 'tint'), text); b.onclick = fn; list.appendChild(b); return b;
}

/* Wallpaper tab. */
function titleOf(id) {
  if (id === state.latestDaily) return t('daily_title');
  if (id === state.rotatePhotos) return t('rotate_title');
  const w = state.wallpapers.find(w => w.id === id);
  return w ? w.title : '';
}
function card(w) {
  const b = el('button', 'wp');
  b.setAttribute('aria-selected', w.id === state.selected ? 'true' : 'false');
  b.innerHTML = `<div class="pic"><img loading="lazy" alt=""><span class="check">${ICON.check}</span></div><div class="t"></div><div class="c"></div>`;
  b.querySelector('img').src = `${base}thumb/${encodeURIComponent(w.id)}`;
  b.querySelector('.t').textContent = w.title;
  b.querySelector('.c').textContent = w.caption || '';
  b.onclick = async () => {
    if (w.id === state.selected) return;
    try { take(await api('api/wallpaper', { id: w.id })); toast(t('toast_wallpaper')); } catch (e) { toast(t('toast_set_fail')); }
  };
  if (w.kind === 'photo') {
    const d = el('button', 'badge'); d.innerHTML = ICON.close; d.setAttribute('aria-label', t('aria_delete'));
    d.onclick = e => {
      e.stopPropagation();
      openSheet(body => {
        const pic = el('div', 'pic'); const img = el('img'); img.src = `${base}thumb/${encodeURIComponent(w.id)}`; pic.appendChild(img); body.appendChild(pic);
        body.appendChild(el('h3', '', t('confirm_delete')));
        body.appendChild(el('p', 'meta', w.title));
        const l = el('div', 'list'); body.appendChild(l);
        action(l, t('aria_delete'), 'danger', async () => { closeSheet(); try { take(await api('api/delete', { id: w.id })); } catch (err) { toast(t('toast_set_fail')); } });
        const c = el('div', 'list'); body.appendChild(c);
        action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
      });
    };
    b.querySelector('.pic').appendChild(d);
  }
  return b;
}
function renderWallpapers() {
  $('#heroImg').src = `${base}thumb/${encodeURIComponent(state.selected)}?topic=${state.dailyTheme || 'all'}`;
  $('#heroTitle').textContent = titleOf(state.selected);
  const root = $('#sections'); root.replaceChildren();
  for (const [kind, title, sub] of groups) {
    let list = state.wallpapers.filter(w => w.kind === kind);
    if (kind === 'daily' && state.dailyTheme !== 'all') list = list.filter(w => w.theme === state.dailyTheme);
    if (kind === 'daily' && state.wallpapers.some(w => w.kind === 'daily')) list = [{ id: state.latestDaily, kind: 'daily', title: t('daily_title'), caption: t('daily_caption') }, ...list];
    // Two or more photos: one a day, as on the TV (#27, #194).
    if (kind === 'photo' && list.length > 1) list = [{ id: state.rotatePhotos, kind: 'photos', title: t('rotate_title'), caption: t('rotate_caption') }, ...list];
    if (!list.length && kind !== 'photo') continue;
    root.appendChild(el('h2', 'big', title));
    if (kind === 'photo') {
      const up = el('label', 'btn add');
      up.innerHTML = `${ICON.plus}<span id="uploadLabel"></span><input id="file" type="file" accept="image/*" multiple hidden>`;
      up.querySelector('span').textContent = uploading ? t('sending_n', { n: uploading }) : t('upload_label');
      if (uploading) up.setAttribute('disabled', '');
      up.querySelector('input').onchange = uploadPhotos;
      root.appendChild(up);
      if (!list.length) { root.appendChild(el('p', 'empty', t('empty_photos'))); continue; }
    }
    const g = el('div', 'grid');
    list.forEach(w => g.appendChild(card(w)));
    root.appendChild(g);
    if (sub) root.appendChild(el('p', 'foot', sub));
    if (kind === 'photo' && list.length === 1) root.appendChild(el('p', 'foot', t('add_second')));
  }
}
let uploading = 0;
async function uploadPhotos(e) {
  const files = [...e.target.files]; if (!files.length) return;
  uploading = files.length; stateJson = ''; render();
  try {
    const fd = new FormData(); files.forEach((f, i) => fd.append('photo' + i, f, f.name));
    const r = await fetch(base + 'api/upload', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(r.status);
    const next = await r.json(); uploading = 0; take(next);
    toast(next.added ? t('toast_added', { n: next.added }) : t('toast_no_photos'));
  } catch (err) { uploading = 0; stateJson = ''; render(); toast(t('toast_send_fail')); }
}

/* Screensaver tab. */
let sendingVideo = '';
function renderScreensaver() {
  document.querySelectorAll('#ss [data-mode]').forEach(b => b.setAttribute('aria-checked', b.dataset.mode === state.screensaver ? 'true' : 'false'));
  $('#ssFoot').textContent = state.screensaverFollows ? t('hint_follows') : state.screensaver === 'system' ? hints.system : '';
  $('#ssFoot').hidden = !$('#ssFoot').textContent;
  $('#videos').hidden = state.screensaver !== 'videos';
  const list = $('#videoList'); list.replaceChildren();
  const videos = state.videos || [];
  if (!videos.length) { const row = el('div', 'item'); row.appendChild(el('span', 'txt', t('videos_empty'))).style.color = 'var(--secondary)'; list.appendChild(row); }
  for (const video of videos) {
    const row = el('div', 'item');
    row.appendChild(el('span', 'txt', video.name));
    const del = el('button', 'link', t('aria_delete')); del.style.color = 'var(--danger)';
    del.onclick = async () => {
      if (!confirm(t('confirm_video_delete', { name: video.name }))) return;
      del.disabled = true;
      try { take(await api('api/videos/delete', { id: video.id })); } catch (err) { del.disabled = false; toast(t('toast_video_bad')); }
    };
    row.appendChild(del); list.appendChild(row);
  }
  $('#videoUploadLabel').textContent = sendingVideo || t('videos_upload');
}
document.querySelectorAll('#ss [data-mode]').forEach(b => b.onclick = async () => {
  if (b.dataset.mode === state.screensaver && !state.screensaverFollows) return;
  try { take(await api('api/screensaver', { mode: b.dataset.mode })); toast(t('toast_tv_updated')); } catch (e) { toast(t('toast_set_fail')); }
});
$('#videoFile').onchange = async e => {
  const input = e.target; const files = [...input.files]; if (!files.length) return;
  const btn = $('#videoUploadBtn');
  input.disabled = true; btn.setAttribute('disabled', '');
  let added = 0;
  for (const [i, file] of files.entries()) {
    sendingVideo = t('sending_video', { n: i + 1, total: files.length }); $('#videoUploadLabel').textContent = sendingVideo;
    if (!file.size || file.size > 200 * 1024 * 1024) continue;
    try {
      const fd = new FormData(); fd.append('video', file, file.name);
      const r = await fetch(base + 'api/videos/upload', { method: 'POST', body: fd });
      if (!r.ok) throw new Error(r.status);
      const next = await r.json(); if (next.saved) added++; take(next);
    } catch (err) { /* Keep going: a failed film should not discard the rest of the batch. */ }
  }
  sendingVideo = ''; input.disabled = false; input.value = ''; btn.removeAttribute('disabled'); stateJson = ''; render();
  toast(t('toast_videos_added', { n: added, failed: files.length - added }));
};

/* More tab: focus style and weather. */
const weatherNames = { clear: t('wx_clear'), partlycloudy: t('wx_partlycloudy'), cloudy: t('wx_cloudy'), fog: t('wx_fog'), rain: t('wx_rain'), snow: t('wx_snow'), thunder: t('wx_thunder') };
function renderLive() {
  const root = $('#liveSources'); root.replaceChildren();
  const sources = (state.live && state.live.sources) || [];
  if (!sources.length) { root.appendChild(el('div', 'item', t('live_empty'))).style.color = 'var(--secondary)'; return; }
  for (const source of sources) {
    const row = el('div', 'item');
    const txt = el('span', 'txt', source.id);
    const counts = t('live_counts', { channels: source.channels || 0, programs: source.epgPrograms || 0 });
    const sub = el('span', 'sub', source.error ? t('live_failed') : !source.lastRefreshMillis ? t('live_unchecked') : source.stale ? `${counts} · ${t('live_cache')}` : counts);
    txt.appendChild(sub); row.appendChild(txt);
    const refresh = el('button', 'link', t('live_refresh')); refresh.onclick = async () => {
      refresh.disabled = true;
      try {
        const next = await api('api/live/refresh', { id: source.id });
        take(next);
        const result = (next.live && next.live.sources || []).find(item => item.id === source.id);
        toast(result && result.error ? t('live_failed') : t('live_refreshed'));
      }
      catch (e) { refresh.disabled = false; toast(t('live_failed')); }
    };
    const remove = el('button', 'link', t('live_delete')); remove.style.color = 'var(--danger)'; remove.onclick = async () => {
      remove.disabled = true;
      try { take(await api('api/live/source/delete', { id: source.id })); toast(t('live_saved')); }
      catch (e) { remove.disabled = false; toast(t('toast_set_fail')); }
    };
    row.append(refresh, remove); root.appendChild(row);
  }
}
function renderMore() {
  document.querySelectorAll('#renderMode [data-render]').forEach(b => b.setAttribute('aria-checked', b.dataset.render === state.renderMode ? 'true' : 'false'));
  $('#renderActive').textContent = t(state.liteMode ? 'render_active_lite' : 'render_active_full');
  document.querySelectorAll('#focus [data-style]').forEach(b => b.setAttribute('aria-checked', b.dataset.style === state.focusStyle ? 'true' : 'false'));
  renderLive();

  $('#wxNow').textContent = w.celsius !== undefined ? `${w.celsius}° ${weatherNames[w.kind] || ''}` : '—';
  $('#wxPlace').textContent = w.place || '';
  const hint = $('#wxHint'); hint.replaceChildren();

    hint.append(t('wx_chosen', { place: w.place }) + ' ');
    const b = el('button', 'link', t('wx_auto_btn'));
    b.onclick = async () => { try { take(await api('api/weather/auto', {})); toast(t('toast_auto')); } catch (e) { toast(t('toast_set_fail')); } };

  } else hint.textContent = w.place ? t('wx_guessed', { place: w.place }) : t('wx_none');

function renderInputs() {
  const inputs = state.inputs || [];
  $('#inputsBox').hidden = !inputs.length || arrView !== null;
  const list = $('#inputs'); list.replaceChildren();
  for (const s of inputs) {
    const row = el('label', 'item');
    const txt = el('span', 'txt', s.name || s.port);
    const sub = [s.name ? s.port : '', s.device].filter(Boolean).join(' · ');
    if (sub) txt.appendChild(el('span', 'sub', sub));
    const sw = el('input', 'switch'); sw.type = 'checkbox'; sw.checked = !!s.pinned; sw.setAttribute('aria-label', s.name || s.port);
    sw.onchange = async () => {

}
document.querySelectorAll('#focus [data-style]').forEach(b => b.onclick = async () => {

/* More tab: diagnostics. */

};
// The page is plain HTTP on the LAN, where browsers offer no navigator.clipboard. So the text is
// copied from a field off screen: 16px so iOS does not zoom, and the scroll put back after, since
// focusing it can still move the page.
$('#diagCopy').onclick = () => {
  const text = $('#diag').textContent, x = window.scrollX, y = window.scrollY;
  const tmp = document.createElement('textarea');
  tmp.value = text; tmp.setAttribute('aria-hidden', 'true');
  tmp.style.cssText = 'position:fixed;top:0;left:-9999px;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(tmp);
  let ok = false;
  try {
    tmp.focus({ preventScroll: true }); tmp.select(); tmp.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
  } catch (e) {}
  tmp.remove(); window.scrollTo(x, y);
  if (!ok) {
    // Select the text in the box so the system's Copy is one tap away.
    const sel = window.getSelection(); sel.removeAllRanges();
    const range = document.createRange(); range.selectNodeContents($('#diag')); sel.addRange(range);
  }
  toast(t(ok ? 'toast_copied' : 'toast_copy_manual'));
};

/*
 * The Home Screen tab: the TV's tiles in a grid as on the TV, dragged into place. A tap on a tile
 * opens one sheet with all it can do (name, icon, folder, hide); a tap on a folder opens it here.
 */
let arrView = null;            // null = Home, else the open folder's id
let arrDragging = false;       // while a tile is held, nothing re-renders under it
let arrPending = false;        // a state that arrived mid-drag, rendered on drop
function tileImg(e) { const i = el('img', 'thumb'); i.alt = ''; i.loading = 'lazy'; i.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; return i; }

async function lay(params, done) {
  try {
    const next = await api('api/layout', params);
    if (!next.saved) throw new Error('not saved');
    take(next); if (done) done(next);
  } catch (e) { toast(t('toast_set_fail')); stateJson = ''; render(); }
}
function folderNameOf(next, key) {
  const L = next.layout || {}; const f = Object.keys(L.folders || {}).find(id => (L.folders[id] || []).some(a => a.key === key));
  const tile = f && (L.home || []).find(e => e.id === f); return tile ? tile.label : '';
}

/* push: true going into a folder, 'back' coming out of one, false for no motion. */
function renderArrange(push) {
  if (arrDragging) { arrPending = true; return; }
  const L = state.layout || { home: [], folders: {}, hidden: [] };
  if (arrView !== null && !(L.folders || {})[arrView]) arrView = null;   // ungrouped, or emptied
  const folderTile = arrView !== null ? L.home.find(e => e.id === arrView) : null;
  const view = el('div', 'view' + (push === 'back' ? ' pop' : push ? ' push' : ''));
  if (!L.ready) view.appendChild(el('p', 'foot', t('arrange_unready'))).style.marginTop = '20px';
  if (folderTile) buildFolderView(view, folderTile, L.folders[arrView] || []);
  else buildHomeView(view, L);
  $('#homeBody').replaceChildren(view);
  $('#inputsBox').hidden = !(state.inputs || []).length || !!folderTile;
  if (tab) setTitle();
  placeShelves();
  if (push) window.scrollTo(0, 0);
}

function buildHomeView(view, L) {
  const grid = tileGrid(L.home, true); grid.style.marginTop = '14px'; view.appendChild(grid);
  sortableGrid(grid, L.home.map(e => e.key),
    (key, target) => lay({ op: 'move', key, target }),
    i => { const e = L.home[i]; e.kind === 'folder' ? (arrView = e.id, renderArrange(true)) : tileSheet(e, null); });
  view.appendChild(el('p', 'foot', t('arrange_hint', { n: state.homeColumns || 5 })));

  view.appendChild(el('h2', '', t('hidden_h')));
  if (L.locked && L.hiddenCount) { view.appendChild(el('p', 'foot', t('hidden_locked', { n: L.hiddenCount }))); return; }
  if (!L.hidden.length) { view.appendChild(el('p', 'foot', t('hidden_none'))); return; }
  const hl = el('div', 'list'); view.appendChild(hl);
  for (const e of L.hidden) {
    const row = el('div', 'item arow'); row.setAttribute('role', 'button'); row.tabIndex = 0;
    row.append(tileImg(e), el('span', 'txt', e.label));
    const b = el('button', 'link act', t('show_app'));
    b.onclick = ev => { ev.stopPropagation(); b.disabled = true; lay({ op: 'unhide', key: e.key }, () => toast(t('toast_shown'))); };
    row.onclick = () => tileSheet(e, null, true);
    row.appendChild(b); hl.appendChild(row);
  }
}

function buildFolderView(view, folder, apps) {
  // The folder's name, edited in place.
  view.appendChild(el('h2', '', t('folder_ph')));
  const nl = el('div', 'list'); view.appendChild(nl);
  const form = el('form', 'item field');
  const input = el('input'); input.type = 'text'; input.value = folder.label; input.maxLength = 24; input.placeholder = t('folder_ph');
  input.setAttribute('enterkeyhint', 'done'); input.autocomplete = 'off'; input.setAttribute('aria-label', t('folder_ph'));
  const save = el('button', 'link', t('save'));
  const sync = () => save.disabled = !input.value.trim() || input.value.trim() === folder.label;
  input.oninput = sync; sync(); form.append(input, save); nl.appendChild(form);
  form.onsubmit = async e => {
    e.preventDefault(); const name = input.value.trim(); if (!name) return; input.blur();
    try { const next = await api('api/folder/name', { id: folder.id, name }); take(next); toast(t(next.saved ? 'toast_folder_renamed' : 'toast_rename_fail')); }
    catch (err) { toast(t('toast_rename_fail')); }
  };

  view.appendChild(el('h2', '', t('folder_count', { n: apps.length })));
  const grid = tileGrid(apps, false); view.appendChild(grid);
  sortableGrid(grid, apps.map(e => e.key), (key, target) => lay({ op: 'movein', key, target }), i => tileSheet(apps[i], folder));
  view.appendChild(el('p', 'foot', t('folder_hint')));

  const al = el('div', 'list'); al.style.marginTop = '28px'; view.appendChild(al);
  action(al, t('ungroup'), 'danger', () => openSheet(body => {
    body.appendChild(el('h3', '', t('ungroup_confirm', { name: folder.label }))).style.marginBottom = '16px';
    const l = el('div', 'list'); body.appendChild(l);
    action(l, t('ungroup'), 'danger', () => { closeSheet(); lay({ op: 'ungroup', folder: folder.id }, () => toast(t('toast_ungrouped'))); });
    const c = el('div', 'list'); body.appendChild(c);
    action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
  }));
}

function tileGrid(entries, shelf) {
  const grid = el('div', 'agrid');
  grid.style.gridTemplateColumns = `repeat(${state.homeColumns || 5}, minmax(0, 1fr))`;
  if (shelf && entries.length) grid.appendChild(el('div', 'shelf'));
  for (const e of entries) {
    const tile = el('div', 'atile'); tile.dataset.key = e.key; tile.setAttribute('role', 'button'); tile.tabIndex = 0;
    tile.setAttribute('aria-label', e.label);
    const pic = el('div', 'tpic'); const img = el('img'); img.alt = ''; img.draggable = false; img.loading = 'lazy';
    img.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; pic.appendChild(img);
    tile.append(pic, el('span', 'n', e.label));
    grid.appendChild(tile);
  }
  return grid;
}
/* The shelf sits behind Home's first row, as the glass plate does on the TV. */
function placeShelves() {
  document.querySelectorAll('#homeBody .agrid').forEach(g => {
    const shelf = g.querySelector('.shelf'); if (!shelf) return;
    const first = [...g.querySelectorAll('.atile')].slice(0, state.homeColumns || 5);
    const bottom = Math.max(...first.map(t => t.offsetTop + t.offsetHeight));
    shelf.style.height = (bottom + 6 - 4) + 'px';
  });
}
addEventListener('resize', placeShelves);

/*
 * Everything one tile can do, in one sheet: its name, its picture, its folder, whether Home shows it.
 * An input's name goes to the input (as from its menu on the TV); an app's to the app.
 */
function tileSheet(e, inFolder, hidden) {
  const a = (state.apps || []).find(x => x.key === e.key) || { key: e.key, label: e.label, default: e.label, name: '' };
  const L = state.layout || {};
  const folders = (L.home || []).filter(x => x.kind === 'folder' && (!inFolder || x.id !== inFolder.id));
  openSheet(body => {
    const pic = el('div', 'pic'); const img = el('img'); img.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; pic.appendChild(img); body.appendChild(pic);
    body.appendChild(el('h3', '', e.label));
    const meta = [a.source ? (a.label === a.port ? t('tag_source') : a.port) : a.name ? t('was_named', { name: a.default }) : '', inFolder ? inFolder.label : ''].filter(Boolean).join(' · ');
    body.appendChild(el('p', 'meta', meta));

    // Name.
    const nl = el('div', 'list'); body.appendChild(nl);
    const f = el('form', 'item field');
    const input = el('input'); input.type = 'text'; input.value = a.name || ''; input.maxLength = 24;
    input.placeholder = a.source ? t('name_ph') : (a.default || a.label);
    input.setAttribute('enterkeyhint', 'done'); input.autocomplete = 'off'; input.setAttribute('aria-label', t('aria_rename'));
    const save = el('button', 'link', t('save'));
    const sync = () => save.disabled = input.value.trim() === (a.name || '');
    input.oninput = sync; sync();
    f.append(input, save); nl.appendChild(f);
    f.onsubmit = async ev => {
      ev.preventDefault(); const name = input.value; closeSheet();
      try {
        const next = await api('api/app/name', { app: a.key, name });
        if (!next.saved) throw new Error('not saved');
        take(next); toast(t(name.trim() ? 'toast_renamed' : 'toast_name_reset'));
      } catch (err) { toast(t('toast_rename_fail')); }
    };
    body.appendChild(el('p', 'foot', a.source ? t('rename_hint') : t('rename_hint_app', { name: a.default || a.label }))).style.marginBottom = '12px';

    // Picture: for an input, the device plugged into it first (as in its menu on the TV).
    const il = el('div', 'list'); body.appendChild(il);
    if (a.source) {
      const cur = (state.devices || []).find(d => d.key === a.device);
      const b = el('button', 'item');
      b.append(el('span', 'txt', t('source_device')), el('span', 'val', cur ? cur.label : t('source_plain')));
      b.insertAdjacentHTML('beforeend', ICON.chev);
      b.onclick = () => deviceChooser(a, e);
      il.appendChild(b);
    }
    // The picker opens from this tap, so iOS treats it as the user's own gesture.
    action(il, t('change_icon'), 'tint', () => { iconFor = a; $('#iconFile').click(); closeSheet(); });
    if (a.custom) action(il, t('aria_reset_icon'), 'tint', async () => {
      closeSheet();
      try { take(await api('api/icon/reset', { app: a.key })); toast(t('toast_icon_reset')); } catch (err) { toast(t('toast_set_fail')); }
    });

    // Place on Home.
    const pl = el('div', 'list'); pl.style.marginTop = '12px'; body.appendChild(pl);
    if (hidden) {
      action(pl, t('show_on_home'), 'tint', () => { closeSheet(); lay({ op: 'unhide', key: e.key }, () => toast(t('toast_shown'))); });
    } else {
      action(pl, t('to_folder'), 'tint', () => folderChooser(e, folders));
      if (inFolder) action(pl, t('out_of_folder'), 'tint', () => { closeSheet(); lay({ op: 'unfolder', key: e.key }, () => toast(t('toast_out_folder'))); });
      action(pl, t('hide_app'), 'danger', () => { closeSheet(); lay({ op: 'hide', key: e.key }, () => toast(t('toast_hidden'))); });
    }
    const c = el('div', 'list'); c.style.marginTop = '12px'; body.appendChild(c);
    action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
  });
}
/* The device on an input: its mark and colours on the tile, its name on the caption (as on the TV). */
function deviceChooser(a, e) {
  const body = $('#sheetBody'); body.replaceChildren();
  body.appendChild(el('h3', '', t('source_device'))); body.appendChild(el('p', 'meta', a.port || e.label));
  const l = el('div', 'list'); body.appendChild(l);
  const choices = [{ key: '', label: t('source_plain'), sub: a.port }].concat(state.devices || []);
  for (const d of choices) {
    const b = el('button', 'item'); b.setAttribute('role', 'radio');
    const txt = el('span', 'txt', d.label); if (d.sub) txt.appendChild(el('span', 'sub', d.sub));
    b.appendChild(txt); b.insertAdjacentHTML('beforeend', ICON.tick);
    b.setAttribute('aria-checked', (a.device || '') === d.key ? 'true' : 'false');
    b.onclick = async () => {
      closeSheet();
      if ((a.device || '') === d.key) return;
      try {
        const next = await api('api/source/device', { app: a.key, device: d.key });
        if (!next.saved) throw new Error('not saved');
        take(next); toast(t('toast_tv_updated'));
      } catch (err) { toast(t('toast_set_fail')); }
    };
    l.appendChild(b);
  }
  body.appendChild(el('p', 'foot', t('source_device_hint'))).style.marginBottom = '12px';
  const c = el('div', 'list'); body.appendChild(c);
  action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
}
function folderChooser(e, folders) {
  const body = $('#sheetBody'); body.replaceChildren();
  body.appendChild(el('h3', '', t('to_folder'))); body.appendChild(el('p', 'meta', e.label));
  const l = el('div', 'list'); body.appendChild(l);
  const go = id => { closeSheet(); lay({ op: 'folder', key: e.key, folder: id || '' }, next => toast(t('toast_in_folder', { name: folderNameOf(next, e.key) }))); };
  for (const f of folders) {
    const b = el('button', 'item'); b.append(tileImg(f), el('span', 'txt', f.label)); b.onclick = () => go(f.id); l.appendChild(b);
  }
  const n = el('button', 'item tint'); n.innerHTML = ICON.plus; n.appendChild(el('span', 'txt', t('new_folder'))); n.onclick = () => go(''); l.appendChild(n);
  const c = el('div', 'list'); body.appendChild(c);
  action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
}

/*
 * Drag a tile to its place, as moving one on the TV. A touch picks the tile up after a short hold
 * (a quick swipe still scrolls the page); a mouse picks it up as soon as it moves. The tile follows
 * the finger with no easing (it is under the finger), the others slide to their new slots on an
 * interruptible transition, and near the top or bottom the page scrolls. On release the tile settles
 * into its slot and the grid takes the new order at once; the TV is told after. A tap is a tap.
 * A second finger is ignored while one tile is held.
 */
/*
 * A tap opens its sheet on the lift, and the phone's browser sends the tap's click a moment later,
 * hit-tested again: it landed on the scrim that had just appeared and closed the sheet at once, or
 * on one of the sheet's buttons (issue #542, Chrome, WeChat and Samsung Internet on Android).
 */
function swallowNextClick() {
  const until = performance.now() + 600;
  const h = e => {
    document.removeEventListener('click', h, true);
    if (performance.now() < until) { e.preventDefault(); e.stopPropagation(); }
  };
  document.addEventListener('click', h, true);
  setTimeout(() => document.removeEventListener('click', h, true), 700);
}

function sortableGrid(grid, keys, onMove, onTap) {
  grid.addEventListener('pointerdown', ev => {
    const tile = ev.target.closest('.atile'); if (!tile || arrDragging || ev.button > 0) return;
    const tiles = [...grid.querySelectorAll('.atile')]; const from = tiles.indexOf(tile);
    const pid = ev.pointerId, touch = ev.pointerType !== 'mouse';
    const sx = ev.clientX, sy = ev.clientY;
    let x = sx, y = sy, lifted = false, ended = false, timer = 0, raf = 0, to = from;
    let cells = [], g0 = null;
    const blockScroll = e => { if (lifted) e.preventDefault(); };

    const lift = () => {
      lifted = true; arrDragging = true;
      try { tile.setPointerCapture(pid); } catch (e) {}
      document.addEventListener('touchmove', blockScroll, { passive: false });
      cells = tiles.map(t => ({ x: t.offsetLeft, y: t.offsetTop, w: t.offsetWidth, h: t.offsetHeight }));
      const r = grid.getBoundingClientRect(); g0 = { x: sx - r.left, y: sy - r.top };
      grid.classList.add('sorting'); tile.classList.add('lift');
      try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
      raf = requestAnimationFrame(edge);
    };
    const slotAt = (px, py) => {
      let best = from, bd = Infinity;
      cells.forEach((c, i) => { const d = (c.x + c.w / 2 - px) ** 2 + (c.y + c.h / 2 - py) ** 2; if (d < bd) { bd = d; best = i; } });
      return best;
    };
    const place = () => {
      const r = grid.getBoundingClientRect(); const gx = x - r.left, gy = y - r.top;
      tile.style.transform = `translate(${gx - g0.x}px, ${gy - g0.y}px)`;
      const next = slotAt(cells[from].x + cells[from].w / 2 + gx - g0.x, cells[from].y + cells[from].h / 2 + gy - g0.y);
      if (next === to) return;
      to = next;
      tiles.forEach((t, j) => {
        if (t === tile) return;
        const k = from < to && j > from && j <= to ? j - 1 : from > to && j >= to && j < from ? j + 1 : j;
        t.style.transform = k === j ? '' : `translate(${cells[k].x - cells[j].x}px, ${cells[k].y - cells[j].y}px)`;
      });
    };
    const edge = () => {
      // The page scrolls; the tab bar covers its bottom.
      const top = 0, bottom = document.querySelector('nav').getBoundingClientRect().top, zone = 70;
      const v = y < top + zone ? -(top + zone - y) / 4 : y > bottom - zone ? (y - (bottom - zone)) / 4 : 0;
      if (v) { window.scrollBy(0, Math.max(-16, Math.min(16, v))); place(); }
      raf = requestAnimationFrame(edge);
    };
    const finish = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', cancel);
      document.removeEventListener('touchmove', blockScroll);
      clearTimeout(timer); cancelAnimationFrame(raf);
    };
    const drop = () => {
      // Settle into the slot, then take the new order without motion.
      tile.style.transition = reducedMotion() ? 'none' : 'transform .2s var(--ease-out)';
      tile.style.transform = `translate(${cells[to].x - cells[from].x}px, ${cells[to].y - cells[from].y}px)`;
      tile.classList.remove('lift');
      setTimeout(() => {
        grid.classList.remove('sorting');
        tiles.forEach(t => { t.style.transition = 'none'; t.style.transform = ''; });
        if (to !== from) grid.insertBefore(tile, to > from ? tiles[to].nextSibling : tiles[to]);
        void grid.offsetHeight; tiles.forEach(t => t.style.transition = '');
        arrDragging = false;
        if (to !== from) onMove(keys[from], keys[to]);
        else if (arrPending) { arrPending = false; renderArrange(false); }
      }, 200);
    };
    const move = e => {
      if (e.pointerId !== pid) return;
      x = e.clientX; y = e.clientY;
      const far = Math.hypot(x - sx, y - sy);
      if (!lifted) {
        if (touch && far > 8) { ended = true; finish(); }   // a swipe: the page scrolls
        else if (!touch && far > 5) { lift(); place(); }
        return;
      }
      place();
    };
    const up = e => {
      if (e.pointerId !== pid || ended) return;
      ended = true; finish();
      if (lifted) drop(); else { swallowNextClick(); onTap(from); }
    };
    const cancel = e => {
      if (e.pointerId !== pid || ended) return;
      ended = true; finish();
      if (lifted) drop();
    };
    if (touch) timer = setTimeout(() => { if (!ended) { lift(); place(); } }, 260);
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', cancel);
  });
  // Keyboard: Enter on a focused tile is a tap.
  grid.addEventListener('keydown', e => {
    const tile = e.target.closest('.atile'); if (!tile || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); onTap([...grid.querySelectorAll('.atile')].indexOf(tile));
  });
}

function render() {
  if (!state) return;
  // The page polls; skip the rebuild when nothing changed, so pictures do not flicker and taps are not lost.
  const json = JSON.stringify(state);
  if (json === stateJson) return;
  stateJson = json;
  renderDesktop();
  renderWallpapers();
  renderScreensaver();
  renderMore();
  renderInputs();
  renderArrange(false);
}

/* Preferences use the same validated settings as the remote-control UI. */
function desktopSelect(root, key, title, values, current, hint) {
  const row = el('label', 'item');
  const text = el('span', 'txt', t(title));
  if (hint) text.appendChild(el('span', 'sub', t(hint)));
  const select = el('select'); select.setAttribute('aria-label', t(title));
  for (const [value, label] of values) { const o = el('option', '', typeof label === 'string' && label.startsWith('@') ? label.slice(1) : t(label)); o.value = String(value); select.appendChild(o); }
  select.value = String(current);
  select.onchange = async () => {
    select.disabled = true;
    try { take(await api('api/desktop', { [key]: select.value })); }
    catch (err) { select.disabled = false; toast(t('toast_set_fail')); }
  };
  row.append(text, select); root.appendChild(row);
}
function renderDesktop() {
  const home = $('#desktopHome'); home.replaceChildren();
  desktopSelect(home, 'columns', 'home_columns', [4,5,6,7,8].map(n => [n, '@'+n]), state.homeColumns);
  desktopSelect(home, 'glass', 'glass_material', [['clear','glass_clear'],['frosted','glass_frosted']], state.glassStyle, 'glass_hint');
  const root = $('#desktopLooks'); root.replaceChildren();
  desktopSelect(root, 'delay', 'aerial_start', [[0,'aerial_immediate'],[2,'@2 s'],[10,'@10 s'],[30,'@30 s']], state.aerialDelay, 'aerial_start_hint');
  desktopSelect(root, 'pause', 'aerial_pause', [[false,'aerial_keep_playing'],[true,'aerial_stop_input']], state.aerialPause, 'aerial_pause_hint');
  desktopSelect(root, 'aerial', 'aerial_category', [['all','topic_all'],['landscapes','topic_nature'],['cities','topic_city'],['underwater','topic_underwater'],['space','topic_space']], state.aerialCategory);
  desktopSelect(root, 'daily', 'daily_theme', [['all','topic_all'],['nature','topic_nature'],['water','topic_water'],['city','topic_city'],['animals','topic_animals'],['space','topic_space'],['other','topic_other']], state.dailyTheme, 'daily_theme_hint');
  $('#dailyMatch').hidden = state.dailyTheme === 'all' || state.dailyMatches > 0;
}
function fileSize(bytes) {
  const n = Math.max(0, Number(bytes) || 0);
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n/(1024*1024)).toFixed(1) + ' MB';
  return (n/(1024*1024*1024)).toFixed(1) + ' GB';
}
let systemBusy = false;
async function refreshSystem() {
  if (systemBusy || document.hidden || $('[data-tab="more"]').hidden) return;
  systemBusy = true;
  try {
    const s = await api('api/system');
    const root = $('#systemStats'); root.replaceChildren();
    const stat = (title, value, sub) => {
      const row = el('div', 'item'); const text = el('span', 'txt');
      text.append(el('span', '', t(title)), el('span', 'sub', sub || '')); row.append(text, el('span', 'val', value)); root.appendChild(row);
    };
    stat('system_info', s.model, 'Android ' + s.android);
    stat('system_cpu', s.cpu + ' · ' + s.cores, t('new_app_cpu', { value: Number(s.appCpuPercent).toFixed(1) }));
    stat('system_memory', t('new_memory',{used:fileSize(s.memoryUsed),total:fileSize(s.memoryTotal)}), t('new_app_mem',{size:fileSize(s.appMemory)}));
    stat('system_storage', t('new_memory',{used:fileSize(s.storageUsed),total:fileSize(s.storageTotal)}));
    stat('system_network', '↓ '+fileSize(s.rxPerSecond)+'/s ↑ '+fileSize(s.txPerSecond)+'/s', s.addresses || t('system_offline'));
    await refreshFiles();
  } catch (err) { $('#systemStats').textContent = t('tools_failed'); }
  finally { systemBusy = false; }
}
async function refreshFiles() {
  const result = await api('api/files'); const root = $('#exchangeFiles');
  // Keep download links stable during a tap or screen-reader navigation.
  const stamp = JSON.stringify(result.files); if (root.dataset.stamp === stamp) return;
  root.dataset.stamp = stamp; root.replaceChildren();
  if (!result.files.length) root.appendChild(el('p','item',t('transfer_empty')));
  for (const f of result.files) {
    const row = el('div','item'); const text = el('span','txt',f.name); text.appendChild(el('span','sub',fileSize(f.bytes)));
    const link = el('a','link',t('transfer_download')); link.href = base+'files/'+encodeURIComponent(f.id); link.download=f.name;
    const remove = el('button','link',t('transfer_remove')); remove.style.color='var(--danger)';
    remove.onclick=async()=>{ if(!confirm(t('transfer_confirm',{name:f.name})))return; remove.disabled=true; try{await api('api/files/delete',{id:f.id}); await refreshFiles();}catch(e){remove.disabled=false;toast(t('tools_failed'));} };
    row.append(text,link,remove); root.appendChild(row);
  }
}
$('#systemRefresh').onclick = refreshSystem;
$('#systemClean').onclick = async e => {
  e.currentTarget.disabled = true;
  try { const r = await api('api/system/clean',{}); toast(t('new_cleaned',{size:fileSize(r.removedBytes)})); await refreshSystem(); }
  catch(err) { toast(t('tools_failed')); }
  finally { $('#systemClean').disabled=false; }
};
$('#exchangeInput').onchange = async e => {
  const file = e.target.files[0]; if(!file)return;
  if(file.size>100*1024*1024 || !file.size){toast(t('tools_failed'));e.target.value='';return;}
  const label=$('#exchangeLabel'); label.textContent=t('new_sending');
  try {
    const data=new FormData();data.append('file',file,file.name);
    const response=await fetch(base+'api/files/upload',{method:'POST',body:data});
    if(!response.ok)throw new Error(response.status);
    await response.json();await refreshFiles();toast(t('tools_saved'));
  }catch(err){toast(t('tools_failed'));}
  finally{label.textContent=t('transfer_upload');e.target.value='';}
};
setInterval(refreshSystem,3000);

initLangSwitch();
applyI18n();
show((location.hash || '').slice(1) || (() => { try { return localStorage.getItem('aerial-tab'); } catch (e) { return null; } })(), true);
async function refresh() { try { state = await api('api/state'); render(); } catch (e) {} }
refresh();
setInterval(() => { if (!document.hidden && sheet.hidden && !arrDragging) refresh(); }, 6000);
</script>
